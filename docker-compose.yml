version: '3.8'

services:

  web:
    build: .
    container_name: docshift_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn docshift.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  worker:
    build: .
    container_name: docshift_worker
    command: celery -A docshift worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      - web
    restart: unless-stopped

  beat:
    build: .
    container_name: docshift_beat
    command: celery -A docshift beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_data:
